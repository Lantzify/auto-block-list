name: Release
on:
  release:
    types:
      - published
permissions:
  contents: read
jobs:
  release_name:
    permissions:
      id-token: write
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    steps:
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{secrets.NUGET_USER}}
      - uses: actions/checkout@v7
      - name: Build project
        run: dotnet build --configuration Release AutoBlockList
      - name: Package files
        run: dotnet pack --configuration Release  AutoBlockList /p:Version=${{github.ref_name}}
      - name: Publish the package
        run: dotnet nuget push AutoBlockList/build/Release/AutoBlockList.${{github.ref_name}}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}
